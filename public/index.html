<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケ大会 ランキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --card-bg:#0b0a10;   /* ランキングの枠の色（黒で塗りつぶし） */
    --card-border:rgba(122,113,163,0.35);
    --gold:#f6b93b;
    --gold-bright:#ffd876;
    --silver:#c7d2e0;
    --silver-bright:#f1f5fa;
    --bronze:#d9884e;
    --bronze-bright:#ffb679;
    --text-primary:#f6f2ea;
    --text-muted:#c7c2e0;
    --danger:#e0607a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:"Noto Sans JP",sans-serif;
    color:var(--text-primary);
    position:relative;
    padding:28px 20px 60px;
  }
  /* Background photo + readability scrim, fixed behind content */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background-image:url("neon-bg.jpg");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      linear-gradient(180deg, rgba(8,4,16,0.45) 0%, rgba(8,4,16,0.62) 42%, rgba(8,4,16,0.75) 100%);
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* Header */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
    border-bottom:1px solid rgba(246,185,59,0.3);
    padding-bottom:16px;
  }
  .title-eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--gold-bright);
    font-weight:700;
    margin-bottom:6px;
    text-shadow:0 2px 10px rgba(0,0,0,0.5);
  }
  h1{
    margin:0;
    font-size:clamp(24px,3.6vw,34px);
    font-weight:900;
    letter-spacing:0.02em;
    text-shadow:0 2px 14px rgba(0,0,0,0.55);
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .live-badge{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:"Rubik",sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--text-muted);
  }
  .live-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 6px rgba(246,185,59,0.8);
    animation:liveBlink 1.6s ease-in-out infinite;
  }
  @keyframes liveBlink{0%,100%{opacity:1;}50%{opacity:0.35;}}
  @media (prefers-reduced-motion:reduce){
    .live-dot{animation:none;}
  }
  .count-badge{
    font-family:"Rubik",sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--text-muted);
    background:rgba(0,0,0,0.32);
    border:1px solid var(--card-border);
    padding:8px 14px;
    border-radius:999px;
    backdrop-filter:blur(6px);
  }
  .count-badge b{color:var(--gold-bright);font-size:17px;}

  /* Entry form */
  .entry-panel{
    background:linear-gradient(180deg, rgba(20,17,34,0.65), rgba(20,17,34,0.5));
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:28px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);
  }
  .entry-panel-label{
    font-size:22px;
    letter-spacing:0.2em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:10px;
  }
  .entry-form{
    display:grid;
    grid-template-columns:1.1fr 1.6fr 0.7fr auto;
    gap:10px;
  }
  @media (max-width:720px){
    .entry-form{grid-template-columns:1fr;}
    .entry-panel{
      padding-left:0;
      padding-right:0;
      margin-left:-20px;
      margin-right:-20px;
      border-radius:0;
    }
    .entry-panel-label{padding:0 16px;}
    .form-msg{padding:0 16px;}
  }
  .entry-form input{
    width:100%;
    background:rgba(0,0,0,0.35);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text-primary);
    font-size:30px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .entry-form input::placeholder{color:#8b84ab;font-size:15px;}
  .entry-form input:focus{border-color:var(--gold);background:rgba(0,0,0,0.5);}
  .entry-form input[type="number"]{font-family:"Rubik",sans-serif;font-weight:600;}
  #addBtn{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#241505;
    border:none;
    border-radius:10px;
    padding:20px 26px;
    font-weight:800;
    font-size:30px;
    cursor:pointer;
    letter-spacing:0.03em;
    transition:filter .15s ease, transform .1s ease;
  }
  #addBtn:hover{filter:brightness(1.08);}
  #addBtn:active{transform:scale(0.97);}
  #addBtn:disabled{
    background:#3a3752;
    color:#847fa0;
    cursor:not-allowed;
  }
  .form-msg{
    font-size:12.5px;
    color:var(--text-muted);
    margin-top:8px;
    min-height:16px;
  }
  .form-msg.limit{color:var(--danger);}

  /* Ranking grid */
  #rankGrid{
    display:grid;
    gap:12px;
  }
  #rankGrid.cols-1{grid-template-columns:minmax(0,1fr);}
  #rankGrid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  #rankGrid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  @media (max-width:900px){
    #rankGrid.cols-2,#rankGrid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:600px){
    #rankGrid.cols-1,#rankGrid.cols-2,#rankGrid.cols-3{grid-template-columns:minmax(0,1fr);}
  }

  .row{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:14px 16px;
    min-height:70px;
  }

  /* name + song sit side by side; song starts at a fixed column so every row lines up */
  .row .info{
    flex:1;
    min-width:0;
    display:flex;
    align-items:baseline;
    justify-content:flex-start;
    gap:14px;
  }
  .row .name{
    font-weight:700;
    font-size:19px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:0 0 40%;   /* 名前の列幅：この%を変えると曲名の開始位置が左右に動きます */
  }
  .row .song{
    font-size:18px;
    color:var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:left;
    flex:1 1 auto;
  }
  .row .song::before{content:"♪ ";}
  /* 3列表示（4位以下が多いとき）は横幅が狭いので、名前の下に曲名を置く */
  #rankGrid.cols-3 .row:not(.first):not(.second):not(.third) .info{
    flex-direction:column;align-items:flex-start;gap:2px;
  }
  #rankGrid.cols-3 .row:not(.first):not(.second):not(.third) .name{flex:0 1 auto;max-width:100%;}
  #rankGrid.cols-3 .row:not(.first):not(.second):not(.third) .song{font-size:15px;max-width:100%;}
  @media (max-width:560px){
    .row .info{flex-direction:column;align-items:flex-start;gap:2px;}
    .row .name{flex:0 1 auto;}
    .row .name,.row .song{max-width:100%;}  /* 文字が点数の上にはみ出さないように */
  }

  .row .rank{
    font-family:"Rubik",sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--text-muted);
    width:20px;
    flex-shrink:0;
    text-align:center;
  }
  .row .score{
    font-family:"Rubik",sans-serif;
    font-weight:800;
    font-size:28px;
    color:var(--gold);
    flex-shrink:0;
    min-width:70px;
    text-align:right;
  }
  .row .del{
    flex-shrink:0;
    background:transparent;
    border:none;
    color:#8b84ab;
    font-size:16px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
    border-radius:6px;
    transition:color .15s ease, background .15s ease;
  }
  .row .del:hover{color:var(--danger);background:rgba(224,96,122,0.15);}

  /* Medal badge for top 3 */
  .medal{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-family:"Rubik",sans-serif;
    font-weight:800;
    flex-shrink:0;
  }

  /* Shared hero treatment for rank 1-3: full width, no spinning parts */
  .row.first, .row.second, .row.third{
    grid-column:1 / -1;
  }

  /* 1st place */
  .row.first{
    background:linear-gradient(135deg, rgba(246,185,59,0.22), transparent 60%), var(--card-bg);
    border:1px solid var(--gold);
    padding:22px 24px;
    min-height:96px;
    animation:glowGold 2.6s ease-in-out infinite;
  }
  .row.first .medal{
    width:56px;height:56px;font-size:26px;color:#241505;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 70%);
    box-shadow:0 0 20px rgba(246,185,59,0.6), inset 0 2px 4px rgba(255,255,255,0.45);
  }
  .row.first .name{font-size:30px;}
  .row.first .song{font-size:25px;}
  .row.first .score{font-size:44px;color:var(--gold-bright);min-width:110px;}

  /* 2nd place */
  .row.second{
    background:linear-gradient(135deg, rgba(199,210,224,0.16), transparent 60%), var(--card-bg);
    border:1px solid var(--silver);
    padding:19px 22px;
    min-height:86px;
    animation:glowSilver 2.8s ease-in-out infinite;
  }
  .row.second .medal{
    width:46px;height:46px;font-size:21px;color:#262b36;
    background:radial-gradient(circle at 35% 30%, var(--silver-bright), var(--silver) 70%);
    box-shadow:0 0 16px rgba(199,210,224,0.55), inset 0 2px 4px rgba(255,255,255,0.45);
  }
  .row.second .name{font-size:25px;}
  .row.second .song{font-size:21px;}
  .row.second .score{font-size:36px;color:var(--silver-bright);min-width:96px;}

  /* 3rd place */
  .row.third{
    background:linear-gradient(135deg, rgba(217,136,78,0.18), transparent 60%), var(--card-bg);
    border:1px solid var(--bronze);
    padding:19px 22px;
    min-height:86px;
    animation:glowBronze 3s ease-in-out infinite;
  }
  .row.third .medal{
    width:46px;height:46px;font-size:21px;color:#3a1d08;
    background:radial-gradient(circle at 35% 30%, var(--bronze-bright), var(--bronze) 70%);
    box-shadow:0 0 16px rgba(217,136,78,0.55), inset 0 2px 4px rgba(255,255,255,0.4);
  }
  .row.third .name{font-size:25px;}
  .row.third .song{font-size:21px;}
  .row.third .score{font-size:36px;color:var(--bronze-bright);min-width:96px;}

  /* スマホ（幅560px以下）では1〜3位の文字・メダル・余白を小さくする */
  @media (max-width:560px){
    .row{gap:10px;padding:12px 12px;}
    .row .score{font-size:24px;min-width:0;}
    .row.first,.row.second,.row.third{padding:14px 12px;min-height:0;}
    .row.first .medal{width:40px;height:40px;font-size:19px;}
    .row.second .medal,.row.third .medal{width:34px;height:34px;font-size:16px;}
    .row.first .name{font-size:22px;}
    .row.second .name,.row.third .name{font-size:19px;}
    .row.first .song{font-size:16px;}
    .row.second .song,.row.third .song{font-size:15px;}
    .row .song{font-size:14px;}
    .row.first .score{font-size:30px;min-width:0;}
    .row.second .score,.row.third .score{font-size:26px;min-width:0;}
    .row .del{padding:4px 2px;}
  }

  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 1px rgba(246,185,59,0.15), 0 0 28px rgba(246,185,59,0.22);}
    50%{box-shadow:0 0 0 1px rgba(246,185,59,0.4), 0 0 48px rgba(246,185,59,0.42);}
  }
  @keyframes glowSilver{
    0%,100%{box-shadow:0 0 0 1px rgba(199,210,224,0.12), 0 0 22px rgba(199,210,224,0.18);}
    50%{box-shadow:0 0 0 1px rgba(199,210,224,0.32), 0 0 38px rgba(199,210,224,0.35);}
  }
  @keyframes glowBronze{
    0%,100%{box-shadow:0 0 0 1px rgba(217,136,78,0.12), 0 0 22px rgba(217,136,78,0.18);}
    50%{box-shadow:0 0 0 1px rgba(217,136,78,0.32), 0 0 38px rgba(217,136,78,0.35);}
  }
  @media (prefers-reduced-motion:reduce){
    .row.first,.row.second,.row.third{animation:none;}
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    color:var(--text-muted);
    padding:50px 10px;
    font-size:14px;
    border:1px dashed var(--card-border);
    border-radius:14px;
    backdrop-filter:blur(6px);
  }

  footer{
    margin-top:24px;
    text-align:right;
  }
  #resetBtn{
    background:rgba(0,0,0,0.25);
    border:1px solid var(--card-border);
    color:var(--text-muted);
    padding:8px 16px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
  }
  #resetBtn:hover{color:var(--danger);border-color:var(--danger);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title-eyebrow">つきまち KARAOKE CONTEST</div>
      <h1>カラオケ大会 ランキング</h1>
    </div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      <div class="count-badge">出場者 <b id="countNum">0</b> / <span id="maxNum">30</span></div>
    </div>
  </header>

  <div class="entry-panel">
    <div class="entry-panel-label">受付入力</div>
    <div class="entry-form">
      <input type="text" id="nameInput" placeholder="名前（例：つきまち太郎）" maxlength="30">
      <input type="text" id="songInput" placeholder="楽曲名（例：いとしのエリー）" maxlength="60">
      <input type="number" id="scoreInput" placeholder="点数" min="0" max="10000" step="1">
      <button id="addBtn">追加する</button>
    </div>
    <div class="form-msg" id="formMsg"></div>
  </div>

  <div id="rankGrid" class="cols-1"></div>

  <footer>
    <button id="resetBtn">全件クリア</button>
  </footer>
</div>

<script>
const API_BASE = '/api/entries';
const RESET_URL = '/api/reset';
const MAX_ENTRIES = 30;
const POLL_INTERVAL_MS = 4000;

let entries = [];

const grid = document.getElementById('rankGrid');
const countNum = document.getElementById('countNum');
const nameInput = document.getElementById('nameInput');
const songInput = document.getElementById('songInput');
const scoreInput = document.getElementById('scoreInput');
const addBtn = document.getElementById('addBtn');
const formMsg = document.getElementById('formMsg');
const resetBtn = document.getElementById('resetBtn');

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function tierClass(rank){
  if(rank === 1) return 'first';
  if(rank === 2) return 'second';
  if(rank === 3) return 'third';
  return '';
}

function setFormMessage(text, isError){
  formMsg.textContent = text || '';
  formMsg.classList.toggle('limit', !!isError);
}

function render(){
  const sorted = entries
    .map((e, idx) => ({...e, _idx: idx}))
    .sort((a,b) => b.score - a.score || a._idx - b._idx);

  countNum.textContent = entries.length;
  addBtn.disabled = entries.length >= MAX_ENTRIES;
  if(entries.length >= MAX_ENTRIES){
    setFormMessage(`上限の${MAX_ENTRIES}名に達しました。`, true);
  }

  if(sorted.length === 0){
    grid.className = 'cols-1';
    grid.innerHTML = '<div class="empty">まだ出場者がいません。フォームから登録してください。</div>';
    return;
  }

  // column count is based on the 4th place and below, since 1st-3rd are always full width
  const restCount = Math.max(0, sorted.length - 3);
  const cols = restCount <= 7 ? 1 : (restCount <= 14 ? 2 : 3);
  grid.className = 'cols-' + cols;

  grid.innerHTML = sorted.map((e, i) => {
    const rank = i + 1;
    const tier = tierClass(rank);
    const rankMarkup = tier
      ? `<div class="medal">${rank}</div>`
      : `<div class="rank">${rank}</div>`;
    return `
      <div class="row ${tier}" data-id="${e.id}">
        ${rankMarkup}
        <div class="info">
          <div class="name">${escapeHtml(e.name)}</div>
          <div class="song">${escapeHtml(e.song)}</div>
        </div>
        <div class="score">${e.score}</div>
        <button class="del" data-id="${e.id}" title="削除">✕</button>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => confirmAndRemove(btn.dataset.id));
  });
}

function confirmAndRemove(id){
  const target = entries.find(e => e.id === id);
  const label = target ? `${target.name}さん（♪${target.song}）` : 'このデータ';
  if(!confirm(`${label}を削除します。\n本当によろしいですか？`)) return;
  removeEntry(id);
}

// Pull the latest shared list from the server. Used on load, on a timer,
// and whenever the tab regains focus, so every phone/PC stays in sync.
async function fetchEntries(){
  try{
    const res = await fetch(API_BASE);
    if(!res.ok) return;
    const data = await res.json();
    entries = data.entries || [];
    render();
  }catch(e){
    console.error('取得に失敗しました', e);
  }
}

async function addEntry(){
  const name = nameInput.value.trim();
  const song = songInput.value.trim();
  const score = scoreInput.value;

  if(entries.length >= MAX_ENTRIES) return;
  if(!name || !song || score === ''){
    setFormMessage('名前・楽曲名・点数をすべて入力してください。', true);
    return;
  }
  const scoreNum = Number(score);
  if(isNaN(scoreNum)){
    setFormMessage('点数は数字で入力してください。', true);
    return;
  }

  addBtn.disabled = true;
  try{
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, song, score: scoreNum})
    });
    const data = await res.json();

    if(!res.ok){
      entries = data.entries || entries;
      if(data.error === 'limit_reached'){
        setFormMessage(`上限の${MAX_ENTRIES}名に達しました。`, true);
      }else{
        setFormMessage('入力内容を確認してください。', true);
      }
      render();
      return;
    }

    entries = data.entries || entries;
    nameInput.value = '';
    songInput.value = '';
    scoreInput.value = '';
    nameInput.focus();
    setFormMessage('', false);
    render();
  }catch(e){
    setFormMessage('通信エラーが発生しました。もう一度お試しください。', true);
  }finally{
    addBtn.disabled = entries.length >= MAX_ENTRIES;
  }
}

async function removeEntry(id){
  try{
    const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}`, {method: 'DELETE'});
    const data = await res.json();
    entries = data.entries || entries;
    render();
  }catch(e){
    console.error('削除に失敗しました', e);
  }
}

addBtn.addEventListener('click', addEntry);
[nameInput, songInput, scoreInput].forEach(inp => {
  inp.addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter'){
      ev.preventDefault();
      addEntry();
    }
  });
});

resetBtn.addEventListener('click', async () => {
  if(!confirm('全員のデータを削除します。よろしいですか？')) return;
  try{
    const res = await fetch(RESET_URL, {method: 'POST'});
    const data = await res.json();
    entries = data.entries || [];
    render();
  }catch(e){
    console.error('リセットに失敗しました', e);
  }
});

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') fetchEntries();
});

fetchEntries();
setInterval(fetchEntries, POLL_INTERVAL_MS);
</script>
</body>
</html>
